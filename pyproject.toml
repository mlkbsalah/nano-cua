[build-system]
requires = ["uv_build>=0.13.6, <0.14.0"]
build-backend = "uv_build"

[project]
name = "nano-cua"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "datasets[vision]>=5.2.0",
    "huggingface-hub>=2.4.0",
    "modal>=1.6.4",
    "numpy>=2.5.4",
    "pyaml>=26.7.0",
    "torch",
    "torchvision>=0.26.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda-12.8", marker = "sys.platform == 'linux'"}
]
torchvision = [
    { index = "pytorch-cuda-12.8", marker = "sys.platform == 'linux'"}
]

[[tool.uv.index]]
name = "pytorch-cuda-12.8"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "huggingface-hub>=2.4.0",
]
