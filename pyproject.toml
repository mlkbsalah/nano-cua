[project]
name = "nano-cua"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "torch",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda-12.8", marker = "sys.platform == 'linux'"}
]

[[tool.uv.index]]
name = "pytorch-cuda-12.8"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
